name: upgrade-islamic-super2

on:
  workflow_dispatch:
    inputs:
      batch_size:
        description: "Names per commit/push batch"
        required: false
        default: "100"
      max_batches:
        description: "Max batches this run (0 = all remaining)"
        required: false
        default: "0"

permissions:
  contents: write

concurrency:
  group: upgrade-islamic-super2
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Configure git
        run: |
          git config user.name "NameVerse Upgrade Agent"
          git config user.email "agent@nameverse.local"

      - name: Upgrade islamic names to super-2.0
        env:
          BATCH_SIZE: ${{ github.event.inputs.batch_size }}
          MAX_BATCHES: ${{ github.event.inputs.max_batches }}
          TARGET_BRANCH: main
        run: python3 upgrading/scripts/super2_upgrade.py
